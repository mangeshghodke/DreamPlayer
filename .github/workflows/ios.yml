name: iOS Build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after signing'
        type: boolean
        required: false
        default: false
      paywall:
        description: 'Enable paywall (PAYWALL_ENABLED=true) for screenshots'
        type: boolean
        required: false
        default: false

jobs:
  build-ios:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} \
            --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }} \
            --dart-define=PAYWALL_ENABLED=${{ inputs.paywall || false }}

      # --- Code signing ---
      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ inputs.upload_testflight == true }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(strings $PP_PATH | grep -A1 UUID | grep string | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Installed profile UUID: $UUID"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build signed IPA
        if: ${{ inputs.upload_testflight == true }}
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(plutil -extract Name raw -o - $RUNNER_TEMP/build_pp.mobileprovision)
          echo "Profile: $PROFILE_NAME | Team: $TEAM_ID"

          python3 -c "
          import plistlib
          plist = {'method': 'app-store', 'teamID': '$TEAM_ID', 'uploadBitcode': False, 'uploadSymbols': True, 'signingStyle': 'manual'}
          with open('$RUNNER_TEMP/ExportOptions.plist', 'wb') as f:
              plistlib.dump(plist, f)
          "

          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DreamPlayer.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cd ..

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DreamPlayer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload signed IPA
        if: ${{ inputs.upload_testflight == true }}
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer-signed.ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == true }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY }}
