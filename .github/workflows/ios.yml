name: iOS Build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after signing'
        type: boolean
        required: false
        default: false
      signed_build:
        description: 'Build signed IPA (for local device install, no upload)'
        type: boolean
        required: false
        default: false
      paywall:
        description: 'Enable paywall (PAYWALL_ENABLED=true) for screenshots'
        type: boolean
        required: false
        default: false

jobs:
  build-ios:
    name: Build iOS app
    # The `xcode-27` image is the only GitHub-hosted runner that ships the
    # iOS 27 SDK (GA 2026-10-15). `macos-latest` still defaults to Xcode 26,
    # and an app must be built with the iOS 27 SDK or later for App Store
    # uploads from April 2027. It is arm64-only, which Flutter supports.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify iOS 27 SDK
        # Fail early and explain, instead of silently shipping an Xcode 26
        # build if the runner label ever falls back. Also prints the exact
        # Xcode/SDK so a support report can be answered from the log.
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcodebuild -showsdks \
            | sed -n 's/.*iphoneos\([0-9][0-9.]*\).*/\1/p' \
            | sort -V | tail -1)"
          echo "iPhoneOS SDK: ${SDK_VERSION:-<none>}"
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::No iPhoneOS SDK found in this Xcode installation."
            exit 1
          fi
          if [ "${SDK_VERSION%%.*}" -lt 27 ]; then
            echo "::error::Building with the iOS $SDK_VERSION SDK. DreamPlayer requires the iOS 27 SDK (runs-on: xcode-27)."
            exit 1
          fi

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter clean
          flutter pub get

      - name: Run tests
        run: flutter test $(find test -name '*_test.dart' ! -name 'widget_test.dart' | sort)

      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ inputs.upload_testflight == true || inputs.signed_build == true }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o $PP_PATH

          # Create a custom keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import WWDR intermediate certificate
          curl -sSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import /tmp/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          # Import certificate and private key
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Verify
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Append custom keychain to search list (keep login keychain)
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Probe actool alternate app icons
        # Diagnostic only -- never fails the build. The shipped IPA has no
        # CFBundleAlternateIcons and its Assets.car holds only "AppIcon", while
        # the repository looks correct by every Linux-side check. Running
        # actool directly settles in seconds whether the CATALOG is wrong or
        # the build SETTINGS never reach actool, which a 13-minute build cycle
        # cannot distinguish. See tool/probe_actool_icons.sh.
        run: |
          chmod +x tool/probe_actool_icons.sh
          tool/probe_actool_icons.sh || echo "::warning::actool probe failed or alternates missing -- see tool/verify_ipa_icons.py for the IPA-side gate"

      - name: Compile libsmb2 (static arm64 archive)
        # Must run before any Xcode build: project.pbxproj links
        # Runner/libsmb2/build/libsmb2.a by path, and that archive is generated
        # rather than checked in. Kept as its own step so a compile failure here
        # is unambiguous instead of surfacing as a wall of link errors.
        run: |
          chmod +x ios/libsmb2_build.sh
          ios/libsmb2_build.sh

      - name: Build signed IPA
        if: ${{ inputs.upload_testflight == true || inputs.signed_build == true }}
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          export PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          export KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          python3 ios/signing_setup.py

      - name: Build unsigned iOS app
        if: ${{ inputs.upload_testflight != true && inputs.signed_build != true }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} \
            --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }} \
            --dart-define=PAYWALL_ENABLED=${{ inputs.paywall || false }}
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -ryq "DreamPlayer-${VERSION}.ipa" Payload

      - name: Verify the IPA carries the libsmb2 object code
        # libsmb2 is LGPL-2.1 and is linked STATICALLY into the app, so
        # section 6(a) requires the object code to accompany the app. The
        # archive is generated by ios/libsmb2_build.sh, so a build that skipped
        # that step (or a packaging change that dropped the asset) would ship
        # without it and quietly break the license. Fail the build instead.
        run: |
          python3 tool/verify_ipa_libsmb2.py

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer.ipa
          path: |
            build/ios/ipa/*.ipa
            DreamPlayer-*.ipa

      - name: Upload dSYM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer.dSYM
          path: build/ios/archive/Runner.xcarchive/dSYMs/
          if-no-files-found: ignore

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == true }}
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # altool needs the .p8 key on disk at ~/private_keys/AuthKey_<key-id>.p8
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY" > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          # altool doesn't expand globs — find the actual IPA
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA found in build/ios/ipa/"
            exit 1
          fi
          echo "Uploading: $IPA_FILE"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
