name: iOS Build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after signing'
        type: boolean
        required: false
        default: false

jobs:
  build-ios:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Run tests
        run: flutter test

      # --- Unsigned build (always produced so you can inspect the app) ---
      # TEST build — always bundles TMDB_API_KEY (also OPENSUBTITLES/SIMKL)
      # so the sideloaded/TestFlight app works without first opening Settings.
      # Release builds (release.yml) intentionally OMIT the TMDB key.
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Package unsigned IPA
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -ryq "DreamPlayer-${VERSION}.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer.ipa
          path: DreamPlayer-*.ipa

      # --- Code signing (only runs once secrets are configured) ---
      - name: Import signing certificate
        if: ${{ env.CERT_BASE64 != '' }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERT_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Install provisioning profile
        if: ${{ env.PROFILE_BASE64 != '' }}
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/DreamPlayer.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/DreamPlayer.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA
        if: ${{ env.HAVE_CERT != '' && env.HAVE_PROFILE != '' }}
        env:
          HAVE_CERT: ${{ secrets.IOS_CERT_BASE64 }}
          HAVE_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: flutter build ipa --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Upload signed IPA
        if: ${{ env.HAVE_CERT != '' && env.HAVE_PROFILE != '' }}
        env:
          HAVE_CERT: ${{ secrets.IOS_CERT_BASE64 }}
          HAVE_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer.ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == true && env.APPSTORE_KEY != '' }}
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_API_KEY }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY }}
