name: iOS Build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after signing'
        type: boolean
        required: false
        default: false
      paywall:
        description: 'Enable paywall (PAYWALL_ENABLED=true) for screenshots'
        type: boolean
        required: false
        default: false

jobs:
  build-ios:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} \
            --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }} \
            --dart-define=PAYWALL_ENABLED=${{ inputs.paywall || false }}

      # --- Code signing via xcodebuild export ---
      - name: Import signing certificate
        if: ${{ inputs.upload_testflight == true }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "password123" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "password123" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "password123" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Verify cert is accessible
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        if: ${{ inputs.upload_testflight == true }}
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/DreamPlayer.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$RUNNER_TEMP/DreamPlayer.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/DreamPlayer.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile UUID: $UUID"
          # List installed profiles
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive and export signed IPA
        if: ${{ inputs.upload_testflight == true }}
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # Find the provisioning profile name
          PROFILE_NAME=$(plutil -extract Name raw -o - "$RUNNER_TEMP/DreamPlayer.mobileprovision")
          echo "Profile name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"

          # Write ExportOptions.plist
          python3 -c "
          import plistlib
          plist = {
              'method': 'app-store',
              'teamID': '${TEAM_ID}',
              'uploadBitcode': False,
              'uploadSymbols': True,
              'signingStyle': 'manual',
          }
          with open('$RUNNER_TEMP/ExportOptions.plist', 'wb') as f:
              plistlib.dump(plist, f)
          "
          cat "$RUNNER_TEMP/ExportOptions.plist"

          # Archive using xcodebuild directly
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DreamPlayer.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -allowProvisioningUpdates
          cd ..

          # Export the archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DreamPlayer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload signed IPA
        if: ${{ inputs.upload_testflight == true }}
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer-signed.ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == true }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY }}
