name: iOS dSYM download

# Pulls the dSYM Apple hosts for a build out of App Store Connect through
# the API (BuildBundle.dSYMUrl), then archives it as a run artifact. With a
# dSYM we can symbolicate crash reports a tester sends us locally; without
# it, our frames in the ASC crash page render as bare Runner 0x… addresses.
# Crash report contents themselves are NOT available through the API.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (blank = newest uploaded build)"
        required: false
        default: ""

jobs:
  dsym:
    runs-on: ubuntu-latest
    steps:
      - name: Download the build dSYM
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          ASC_BUILD: ${{ github.event.inputs.build }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          import jwt

          key = os.environ["ASC_API_KEY"]
          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          wanted_build = os.environ.get("ASC_BUILD", "").strip()

          headers = None

          def get(path):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode("utf-8", "replace")
                  print(f"HTTP {err.code} on {path}:\n{body[:1500]}")
                  raise

          token = jwt.encode(
              {
                  "iss": issuer,
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": key_id},
          )
          headers = {"Authorization": "Bearer " + token}

          apps = get("/v1/apps?filter%5BbundleId%5D=com.dreamplayer.app")
          if not apps["data"]:
              raise SystemExit("No app found for com.dreamplayer.app")
          app_id = apps["data"][0]["id"]

          path = (
              f"/v1/builds?filter%5Bapp%5D={app_id}"
              "&fields%5Bbuilds%5D=version,uploadedDate,processingState"
              "&sort=-uploadedDate"
          )
          if wanted_build:
              path += f"&filter%5Bversion%5D={wanted_build}"
          builds = get(path)
          if not builds["data"]:
              raise SystemExit(f"No build found (filter: {wanted_build or 'none'})")
          build = builds["data"][0]
          attrs = build["attributes"]
          print(f"app id: {app_id}")
          print(f"build: {attrs['version']} uploaded {attrs['uploadedDate']}"
                f" state {attrs['processingState']}")

          bundles = get(f"/v1/builds/{build['id']}/buildBundles")["data"]
          if not bundles:
              raise SystemExit("Build has no bundle entries")
          url = bundles[0]["attributes"].get("dSYMUrl")
          if not url:
              print(json.dumps({k: v for k, v in bundles[0]["attributes"].items()
                                if not k.endswith("Url")}, indent=2)[:2000])
              raise SystemExit("BuildBundle carries no dSYMUrl for this build")

          req = urllib.request.Request(url)
          with urllib.request.urlopen(req) as resp, open("dsym.zip", "wb") as fh:
              fh.write(resp.read())
          print("downloaded dsym.zip")
          PY
          unzip -q dsym.zip -d dsym
          find dsym -type f | head -20

      - name: Upload dSYM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamPlayer.dSYM
          path: dsym/
          if-no-files-found: error
