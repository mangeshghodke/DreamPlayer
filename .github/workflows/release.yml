name: Release

# Publishing a release is just tagging: `git tag v0.1.0 && git push origin v0.1.0`.
# This workflow builds the Android split-per-abi APKs and creates a GitHub
# Release on the tag with them attached. No iOS artifact is built or attached
# here — unsigned IPA sideloading is retired (DPLA 7.6/3.2(g): iOS apps may
# only be distributed via the App Store, TestFlight, or Ad Hoc). Signed
# TestFlight builds come from the separate ios.yml workflow.
# (No AAB — Play Store publishing isn't set up yet.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags. The versionCode guard below compares this
          # commit's pinned versionCode against the PREVIOUS TAG's, so it needs
          # `git describe` / `git show <tag>:<path>` to resolve.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Every published APK must be signed with the SAME certificate. Android
      # refuses an update whose signer differs from the installed one
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), so a per-run key silently breaks
      # updates for every user. Before this step the release buildType fell back
      # to the runner's throwaway debug key, which meant NO two GitHub releases
      # could ever be installed over one another -- every release since v0.4.7
      # required a manual uninstall (issue #43).
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set. Refusing to publish an APK signed with the runner's throwaway debug key -- that breaks updates for every user (issue #43)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Paths must match build.gradle.kts exactly: key.properties is read
          # from the ROOT project dir, and storeFile is resolved against the
          # APP module dir.
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Rename artifacts with app name and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "DreamPlayer-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk "DreamPlayer-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "DreamPlayer-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk "DreamPlayer-${VERSION}-x86_64.apk"


      # Guards the regression that caused #43 at the source: assert the APKs we
      # are about to publish carry DreamPlayer's release certificate and not a
      # debug one. Cheap, and it fails the release instead of silently shipping
      # an uninstallable update.
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          # Colon-less uppercase hex. apksigner prints "SHA-256 digest:
          # <hex>" with NO separators, so compare in that normalised form --
          # a colon'd literal here silently never matches and would fail every
          # single release.
          EXPECTED="2FF29762E3621B29F2ED8C5059143E4F3AAE107FD5BFAE6456BAF60C4CD52D5F"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs found to verify"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            CERT="$("$BT/apksigner" verify --print-certs "$apk" \
              | grep -i 'SHA-256 digest' | head -1 \
              | sed 's/.*digest://' | tr -d '[:space:]:' | tr 'a-f' 'A-F')"
            echo "$(basename "$apk") signer SHA-256: $CERT"
            if [ -z "$CERT" ] || [ "$CERT" != "$EXPECTED" ]; then
              echo "::error::$(basename "$apk") is NOT signed with the DreamPlayer release key (got ${CERT:-<none>}). Users would have to uninstall to update (issue #43)."
              exit 1
            fi
          done
          echo "All APKs signed with the DreamPlayer release certificate."

      # The other half of issue #43, and the half that is NOT already
      # automated. versionCode is pinned BY HAND in android/app/build.gradle.kts
      # (it cannot come from pubspec's "+N", which also drives the iOS build
      # number). Android refuses an APK whose versionCode is not greater than
      # the installed one, so a forgotten bump means every user has to
      # uninstall before they can install the release. Nothing else in this
      # workflow would notice, so assert it here.
      - name: Verify versionCode increases over the previous release
        run: |
          set -euo pipefail
          extract_code() {
            grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' "$1" \
              | grep -oE '[0-9]+' | head -1 || true
          }
          CURRENT="$(extract_code android/app/build.gradle.kts)"
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read versionCode from android/app/build.gradle.kts"
            exit 1
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          PREV=""
          if [ -n "$PREV_TAG" ]; then
            PREV="$(git show "$PREV_TAG:android/app/build.gradle.kts" 2>/dev/null \
              | grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' \
              | grep -oE '[0-9]+' | head -1 || true)"
          fi
          echo "versionCode: previous ${PREV:-<none>} (${PREV_TAG:-no prior tag}) -> current $CURRENT"
          if [ -n "$PREV" ] && [ "$CURRENT" -le "$PREV" ]; then
            echo "::error::versionCode $CURRENT is not greater than $PREV (from $PREV_TAG). Android refuses a non-increasing versionCode, so every existing install would have to be uninstalled first (issue #43). Bump versionCode in android/app/build.gradle.kts."
            exit 1
          fi

          # Report what the release actually ships. Flutter's split-per-abi
          # multiplies by 1000 (abiVersionCode * 1000 + base, ARM64 -> 2), so
          # the split APKs carry far higher codes than universal. Updating in
          # place is fine, but it does mean a user who installs a split APK can
          # never afterwards move to universal -- so universal is the safe
          # download to recommend.
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          if [ -n "$AAPT" ] && [ -x "$AAPT" ] && [ ${#apks[@]} -gt 0 ]; then
            for apk in "${apks[@]}"; do
              code="$("$AAPT" dump badging "$apk" \
                | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
              echo "  $(basename "$apk"): versionCode=$code"
            done
          else
            echo "  No built APKs to report (or aapt2 unavailable)."
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-android
          path: |
            build/app/outputs/flutter-apk/DreamPlayer-*.apk

  release:
    name: Create GitHub Release
    needs: [android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body (changelog entry + install guide)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          {
            echo "## What's new in DreamPlayer $VERSION"
            echo
            cat /tmp/changelog-entry.md
            echo
            cat .github/release_notes.md
          } > /tmp/release-body.md
          echo "BODY=/tmp/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY }}
          generate_release_notes: true
          files: |
            artifacts/dreamplayer-android/**/*.apk
