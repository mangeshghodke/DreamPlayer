name: Release

# Publishing a release is just tagging: `git tag v0.1.0 && git push origin v0.1.0`.
# This workflow builds the Android split-per-abi APKs and the unsigned
# iOS IPA, then creates a GitHub Release on the tag and attaches them all.
# (No AAB — Play Store publishing isn't set up yet.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Rename artifacts with app name and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "DreamPlayer-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk "DreamPlayer-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "DreamPlayer-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk "DreamPlayer-${VERSION}-x86_64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-android
          path: |
            build/app/outputs/flutter-apk/DreamPlayer-*.apk

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: |
          flutter config --enable-ios
          flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Package unsigned IPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -ryq "DreamPlayer-${VERSION}.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamplayer-ios
          path: DreamPlayer-*.ipa

  release:
    name: Create GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body (changelog entry + install guide)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          {
            echo "## What's new in DreamPlayer $VERSION"
            echo
            cat /tmp/changelog-entry.md
            echo
            cat .github/release_notes.md
          } > /tmp/release-body.md
          echo "BODY=/tmp/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY }}
          generate_release_notes: true
          files: |
            artifacts/dreamplayer-android/**/*.apk
            artifacts/dreamplayer-ios/DreamPlayer-*.ipa
