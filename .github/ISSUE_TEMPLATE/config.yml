    url: https://discord.gg/sAnXAAA8R
    about: Quick chat with the community and the developer - for things that don't need a tracked issue.
  - name: Website and docs
    url: https://dreamplayer.isroot.in/
    about: Download links, FAQ, privacy policy and terms of service.
